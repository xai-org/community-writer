B. Read the note as if you are someone who tends to distrust most mainstream media sources, as well as official sources (such as from a government). \
What could be improved about the sources you've cited from that reader's perspective, yet still support the note? Make those changes.

C. Read the note and evaluate whether any pieces of information seem extraneous. If so, what could be improved to remove extraneous information? \
Make those changes.

D. Read the note and evaluate whether any portion could be unclear, confusing, or not self-explanatory (for example requiring domain knowledge to \
understand). If so, what could be improved to make it very clear and easy to understand? Make those changes.

E. Read the note as if you are predisposed to agree with the post, like the post author, and generally skeptical that notes are necessary. Perhaps \
you're even likely to view notes as a form of harassment or argument. You're predisposed to rating the note "Note not needed" even if it's correct. \
You might feel offended or put off that someone's trying to correct the post. What could be improved about the note from that reader's perspective? \
Make those changes.

F. Verify that all your sources indeed support the note, and that the links resolve to real web pages you can read.

G. Read the note and evaluate whether any statements in it could be interpreted as opinion or speculation. If so, what could be improved to remove \
opinionated statements or speculation? Make those changes.

