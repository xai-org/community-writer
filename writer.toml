rejector_prompt = """
INSTRUCTIONS:

Evaluate a proposed Community Note for inadequate media sourcing. Score from 0.0 (extremely problematic) to 1.0 (not at all problematic).

You will receive a post link, a proposed note, and screenshots of each URL cited in the note. Use your tools for viewing media on X \
to examine any media embedded in the post itself. Treat URL screenshots \
as the authoritative representation of media at each URL, even with partial rendering errors. If a screenshot is blank, missing, or shows \
an error (e.g. 404), do NOT assume the URL's media supports the note. You may use browse_page to understand missing webpage text, but DO \
NOT infer anything about media at a URL from its text content.

SCORE 1.0 — NOT PROBLEMATIC:

Score 1.0 if ANY of the following apply:
* The post has no media, or the note makes no claims about the post media.
* The post media is primarily text-based content (e.g. a screenshot of a news article, a quote overlay). Minor text like timestamps or \
labels does not qualify.
* The note's source links contain media that MATCHES the post media.

SCORE 0.0 — PROBLEMATIC:

Score 0.0 if ANY of the following apply:
* The note refers to media the post doesn't contain.
* The note merely identifies the post media as a cartoon (easily discernible by a reasonable person). Exception: notes about video \
game footage passed off as real combat are acceptable and should score 1.0 if sourced appropriately.

Additionally, score 0.0 if ALL of the following hold:
1. The post contains media.
2. The note makes claims about that media (e.g. reassigns it to a different event, claims a different context, contradicts what the \
media depicts, or claims it is AI-generated).
3. The note implies its source links support those claims.
4. The source links do NOT contain media EXACTLY MATCHING the post media.

...unless one of the exceptions below applies.

EXCEPTIONS — WHEN MISSING EXACT MATCH IS ACCEPTABLE (SCORE 1.0):

When all four conditions above are met but one of the following also applies, the note should score 1.0:

Content visible in the media itself:
* Elements within the media (e.g. AI watermark, timestamp, date, social media handle) establish it is fake or out of context, and the \
note explains their significance. If the identifying content is text, it must be in the same language as both the note and the post.

Text-based contradiction without media reassignment:
* The note cites up-to-date sources that specifically contradict the post's claims. These sources may be entirely text-based. However, \
the note MUST NOT reassign the media to another specific event without EXACTLY MATCHING media as evidence. The note MAY suggest the \
media is AI-generated. Example: a note may cite sources calling a ship's alleged destruction misinformation, but MUST NOT claim the \
image shows a different specific ship.

Recantation or denial:
* The original media poster recants and identifies the content as misleading, out of context, or AI-generated. (The originating account \
may differ from the account that made the post the note is attached to.)
* The post originates from a parody or satire account.
* An entity (e.g. person or organization) depicted in the media states the media is fake, manipulated, or inaccurate.

Identity disputes:
* The note claims a person in the media is misidentified. The note MUST include sourcing with an image establishing either the true \
identity (likeness matches the post media) or that the alleged person's likeness does not match.

AI-generation claims by analogy:
* The note claims the media is AI-generated and cites sources showing similar content has been AI-generated (e.g. AI cruise ship \
sinking videos are common). The note MUST frame sources as identifying SIMILAR content and MUST NOT imply an exact match to the post media.

OUTPUT FORMAT:

Return your score as JSON in a fenced code block:

```json
{{
  "score": ...,
  "reasoning": ...
}}
```

INPUTS:

post: {post_link}

proposed note:
```
{note_text}
```
"""

