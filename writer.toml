[[rl_rejectors]]
rejector_name = "cn_rejector_1"
model_alias = "rejector_primary"
model_uri = "api.x.ai"
temperature = 1.0
num_samples = 5
max_retries_llm = 4
retry_base_delay = 120.0
rejector_prompt = """
Please determine whether the following proposed Community Note is likely to be found Helpful or Not Helpful for the associated post.

Post:
{post_link}

Proposed Community Note:
{note_text}

Estimate how likely X Community Notes raters - including raters who often disagree with each other politically - are to rate the proposed note \
Helpful, and report that likelihood as a score from 0.0 to 1.0.

A note is likely to be rated Helpful when it:
* Is accurate and directly supported by its source links.
* Changes what a reader takes away from the post, by correcting a false or unsupported claim, supplying essential missing context, identifying \
fabricated, AI-generated, edited or miscaptioned media, or flagging recycled content presented as new.
* Addresses a post making a sincere statement of fact. Notes attached to jokes, hyperbole, sarcasm or opinions are rarely rated Helpful.
* Is phrased so that readers on both sides of a disagreement would accept it.

Accuracy is necessary but not sufficient. Most proposed notes are accurate; once you are satisfied that this one is, the decisive question is whether \
it materially changes what a reader takes away from the post. An accurate, well-sourced note that does not change the takeaway is Not Helpful.

A note is likely to be rated Not Helpful when it:
* Is accurate but corrects a peripheral detail that does not change what a reader takes away from the post.
* Takes a contested interpretive position (motive, framing, what "really" happened) instead of establishing a verifiable fact.
* Cites sources that do not actually establish the claim it makes.
* Editorializes, speculates, insults, or argues with the poster.

When judging sources, what matters is whether a cited source actually establishes the note's claim. A single source that clearly establishes the claim \
supports a note just as well as several do; do not give a note extra credit for citing more sources. An X post is strong evidence when the post itself \
is what is in question, for example the original of an edited screenshot or an earlier identical post. A very short note can be maximally helpful; \
brevity is not a defect.

Judge the note only against the criteria above; do not introduce additional requirements. In particular, do not deduct for a note's style, tone, or \
brevity, for wording you would have phrased differently, or for caveats it leaves out that would not change a reader's takeaway. A note that meets the \
criteria is Helpful even if it is not the best possible note.

Calibrate your score roughly as follows, and use intermediate values freely:
* 0.9 and above - meets every criterion; you expect most raters to find it Helpful. Use this range for strong notes, and 1.0 when you cannot fault the \
note.
* around 0.7 - probably Helpful, with one weakness you can name.
* around 0.5 - genuinely uncertain, or strong in some respects and weak in others.
* around 0.3 - probably Not Helpful: accurate but immaterial, weakly supported, interpretive, or attached to a post that does not need a note.
* 0.1 and below - inaccurate, abusive, or incoherent.

Report the value that matches your confidence. Do not round to a convenient number, and do not default to the middle of the range when the evidence \
points one way. Scores between 0.4 and 0.6 mean you genuinely cannot tell, and should be uncommon: if you can name the criterion the note clearly \
meets or clearly fails, commit to a score outside that band.

Return your score as JSON in a fenced code block:

```json
{{
  "score": ...,
  "reasoning": ...
}}
```

Return only the JSON object inside the fence. Do not apply markdown formatting to any part of it.
{suggested_sources}\
"""

